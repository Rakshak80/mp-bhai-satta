<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Results Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        #navbar {
            width: 100%;
            text-align: center;
            margin: 4px 0;
        }

        .nav-link {
            width: 99.8%;
            max-width: 960px;
            margin: 8px auto;
            border: 1px solid #003399;
            background: rgb(23, 108, 238);
        }

        .nav-text {
            padding: 10px 4px;
            line-height: 20px;
            color: white;
            margin: 0;
            font-size: 20px;
        }

        #section {
            width: 100%;
            text-align: center;
            margin: 4px 0 12px;
        }

        #container {
            width: 98%;
            max-width: 960px;
            margin: auto;
        }

        .content {
            width: 96%;
            max-width: 424px;
            margin: 8px auto;
        }

        .game-table {
            width: 100%;
            border-collapse: collapse;
        }

        .game-date {
            width: 100%;
            height: 40px;
            border: 1px solid #339966;
            background: #33cc99;
        }

        .game-date td {
            vertical-align: middle;
            font-size: 1em;
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 8px;
        }

        .game-result {
            width: 100%;
            min-height: 60px;
            background: white;
            border: 1px solid #ccc;
        }

        .game-result:hover {
            background: #f1f1f1;
        }

        .game-details {
            width: 64%;
            vertical-align: middle;
            text-align: left;
            padding: 7px;
        }

        .game-name {
            margin: 2px 8px;
            font-size: 17px;
            line-height: 22px;
        }

        .game-time {
            margin: 2px 8px;
            font-size: 13px;
            font-weight: normal;
        }

        .game-link {
            margin: 2px 8px;
            font-size: 12px;
            font-weight: normal;
        }

        .game-link a {
            text-decoration: none;
            color: #003399;
        }

        .yesterday-number,
        .today-number {
            width: 18%;
            text-align: center;
            vertical-align: middle;
            padding: 5px;
        }

        .yesterday-number h3,
        .today-number h3 {
            margin: 4px;
            font-size: 23px;
        }

        .number-box {
            display: inline-flex;
            width: 48px;
            height: 40px;
            align-items: center;
            justify-content: center;
            border: 1px solid #339966;
            background: #33cc99;
            color: white;
            font-weight: bold;
            font-size: 19px;
        }

        .blank-box {
            border-color: #da040c;
            background: #f7435e;
        }

        .highlight {
            background: #fbc503;
            border: #bf8302 1px solid;
        }

        .highlight:hover {
            background: #ccc;
            border-color: #bf8302;
        }

        .section-title {
            width: 100%;
            margin: 15px 0 5px;
            padding: 9px;
            background: #003399;
            color: white;
            text-align: center;
            font-size: 19px;
            border-radius: 3px;
        }

        .info-box {
            background: white;
            border: 1px solid #ccc;
            padding: 14px;
            margin-top: 12px;
            text-align: center;
            line-height: 1.5;
        }

        #footer {
            width: 100%;
            text-align: center;
            margin: 15px auto;
        }

        .refresh-button {
            border: #e7aa26 1px solid;
            background: #fbc503;
            color: red;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 600px) {

            #container {
                width: 100%;
            }

            .content {
                width: 98%;
                margin: 6px auto;
            }

            .nav-text {
                font-size: 17px;
            }

            .game-details {
                width: 58%;
            }

            .today-number,
            .yesterday-number {
                width: 21%;
            }

            .game-name {
                font-size: 14px;
                margin: 2px 4px;
            }

            .game-time {
                font-size: 11px;
                margin: 2px 4px;
            }

            .game-link {
                font-size: 10px;
                margin: 2px 4px;
            }

            .number-box {
                width: 42px;
                height: 36px;
                font-size: 17px;
            }

            .yesterday-number h3,
            .today-number h3 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div id="navbar">
    <div class="nav-link">
        <h1 class="nav-text">Results Dashboard</h1>
    </div>
</div>

<div id="section">
    <div id="container">

        <!-- LIVE -->
        <div class="content">
            <div class="section-title">LIVE</div>

            <table class="game-table">
                <tbody id="LiveGames"></tbody>
            </table>
        </div>

        <!-- NEXT -->
        <div class="content">
            <div class="section-title">NEXT</div>

            <table class="game-table">
                <tbody id="NextGames"></tbody>
            </table>
        </div>

        <!-- REST -->
        <div class="content">
            <div class="section-title">OTHER</div>

            <table class="game-table">
                <tbody id="RestGames"></tbody>
            </table>
        </div>

        <div class="content">
            <div class="info-box">
                <strong>Information</strong>
                <br>
                This is a static results-dashboard demo.
                <br>
                Data can be replaced with your own non-gambling content.
            </div>
        </div>

    </div>
</div>

<div id="footer">
    <button class="refresh-button" onclick="location.reload()">
        Refresh
    </button>
</div>

<script>
    /*
     * Static demo data.
     * Replace these labels/numbers with ordinary non-gambling
     * dashboard data as needed.
     */

    const demoData = [
        {
            name: "Dashboard One",
            time: "10:00 AM",
            yesterday: "--",
            today: "--"
        },
        {
            name: "Dashboard Two",
            time: "11:30 AM",
            yesterday: "--",
            today: "--"
        },
        {
            name: "Dashboard Three",
            time: "01:00 PM",
            yesterday: "--",
            today: "--"
        },
        {
            name: "Dashboard Four",
            time: "02:30 PM",
            yesterday: "--",
            today: "--"
        },
        {
            name: "Dashboard Five",
            time: "04:00 PM",
            yesterday: "--",
            today: "--"
        },
        {
            name: "Dashboard Six",
            time: "05:30 PM",
            yesterday: "--",
            today: "--"
        },
        {
            name: "Dashboard Seven",
            time: "07:00 PM",
            yesterday: "--",
            today: "--"
        },
        {
            name: "Dashboard Eight",
            time: "08:30 PM",
            yesterday: "--",
            today: "--"
        },
        {
            name: "Dashboard Nine",
            time: "10:00 PM",
            yesterday: "--",
            today: "--"
        },
        {
            name: "Dashboard Ten",
            time: "11:30 PM",
            yesterday: "--",
            today: "--"
        }
    ];

    function createRow(item) {

        const row = document.createElement("tr");
        row.className = "game-result highlight";

        row.innerHTML = `
            <td class="game-details">
                <h3 class="game-name">${escapeHTML(item.name)}</h3>
                <h3 class="game-time">at (${escapeHTML(item.time)})</h3>
                <h3 class="game-link">
                    <a href="#" onclick="return false;">View</a>
                </h3>
            </td>

            <td class="yesterday-number">
                <h3>
                    <span class="number-box">
                        ${escapeHTML(item.yesterday)}
                    </span>
                </h3>
            </td>

            <td class="today-number">
                <h3>
                    <span class="number-box blank-box">
                        ${escapeHTML(item.today)}
                    </span>
                </h3>
            </td>
        `;

        return row;
    }

    function escapeHTML(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function loadDashboard() {

        const live = document.getElementById("LiveGames");
        const next = document.getElementById("NextGames");
        const rest = document.getElementById("RestGames");

        live.innerHTML = "";
        next.innerHTML = "";
        rest.innerHTML = "";

        demoData.forEach((item, index) => {

            const row = createRow(item);

            if (index < 4) {
                live.appendChild(row);
            }
            else if (index < 8) {
                next.appendChild(row);
            }
            else {
                rest.appendChild(row);
            }
        });
    }

    document.addEventListener("DOMContentLoaded", loadDashboard);
</script>

</body>
    </html>
